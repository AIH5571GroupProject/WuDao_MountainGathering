<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WuDao Experience Template</title><style>:root{color:#394c39;background:#e9ecdf;font-family:Georgia,'SimSun',serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;gap:24px}button{color:#394c39;background:#f0f0df;border:1px solid #8c9d7c;padding:14px 24px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #986c50;outline-offset:4px}body:after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#394c3908 3px 4px)}</style></head><body><h1 id="title">新的相逢</h1><p id="status">准备就绪</p><button id="complete">完成体验</button><button id="back">返回篇章</button><script>
// Copy to public/experiences/<arenaId>/index.html; set the arena ID to match its registration.
const arenaId='shaolin', parentOrigin=location.origin;
let context=null, paused=false, disposed=false;
const send=(type,extra={})=>{if(parent!==window)parent.postMessage({type,version:1,arenaId,...extra},parentOrigin)};
const render=()=>{const en=context?.language==='en';document.documentElement.lang=en?'en':'zh-CN';document.getElementById('title').textContent=en?'A new encounter':'新的相逢';document.getElementById('status').textContent=paused?(en?'Paused':'已暂停'):(en?'Ready':'准备就绪');document.getElementById('complete').textContent=en?'Complete experience':'完成体验';document.getElementById('back').textContent=en?'Back to chapter':'返回篇章'};
function dispose(){disposed=true;window.removeEventListener('message',receive);/* cancel animation frames, stop media tracks, dispose renderer and audio here */}
function receive(event){if(event.source!==parent||event.origin!==parentOrigin||event.data?.version!==1||event.data?.arenaId!==arenaId)return;const data=event.data;if(data.type==='wudao:init'||data.type==='wudao:context'){context=data;render()}if(data.type==='wudao:pause'){paused=data.paused;render()}if(data.type==='wudao:dispose')dispose()}
window.addEventListener('message',receive);window.addEventListener('pagehide',dispose,{once:true});
document.getElementById('complete').onclick=()=>{if(!disposed)send('wudao:complete',{result:{completed:true,summary:'template'}})};
document.getElementById('back').onclick=()=>send('wudao:exit');send('wudao:ready');
</script></body></html>
