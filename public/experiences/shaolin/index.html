<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9ecdf">
<title>少林功夫 · Shaolin Kung Fu</title>
<style>
:root{
  --paper:#e9ecdf;--paper-2:#f3f0e2;--ink:#253422;--muted:#6c7a63;
  --matcha:#52654a;--seal:#a25c49;--verm:#b8432e;--line:rgba(37,52,34,.24);
  --serif:'Noto Serif SC','Songti SC','STSong',Georgia,serif;
  --kai:'Kaiti SC','STKaiti','KaiTi',var(--serif);
  --song:'Songti SC','STSong','SimSun',serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--serif);
  display:grid;grid-template-rows:64px minmax(0,1fr) 30px;overflow:hidden;
}
button{color:inherit;font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--seal);outline-offset:4px}
.crt{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(34,50,39,.09) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(103,119,81,.03) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at 50% 47%,transparent 56%,rgba(41,63,43,.1) 100%)}
.grain{position:fixed;inset:0;z-index:98;pointer-events:none;opacity:.12;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(233,236,223,.94)}
.brand{display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.brand b{font:400 16px/1 var(--serif);letter-spacing:.18em}
.brand small{font:10px 'Cormorant Garamond',Georgia,serif;letter-spacing:.2em;color:var(--muted)}
.nav{display:flex;align-items:stretch;height:100%;gap:2px}
.nav button{border:0;background:none;padding:0 15px;position:relative;font-size:12px;letter-spacing:.1em;color:var(--muted)}
.nav button i{font:11px 'Cormorant Garamond',Georgia,serif;margin-right:8px;opacity:.7}
.nav button:hover{color:var(--ink)}
.nav button.active{color:var(--seal)}
.nav button.active:after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--seal)}
.tools{display:flex;align-items:center;gap:14px;white-space:nowrap}
.lang-chip{font:10px 'Cormorant Garamond',Georgia,serif;letter-spacing:.16em;color:var(--muted);border:1px solid var(--line);padding:5px 8px}
.ghost-btn{background:none;border:1px solid var(--line);padding:8px 13px;font-size:11px;letter-spacing:.08em}
.ghost-btn:hover{border-color:var(--seal);color:var(--seal)}

main{position:relative;min-height:0;overflow:auto}
.panel{display:none;min-height:100%;padding:clamp(18px,3.2vw,42px) clamp(18px,5vw,74px) 46px;animation:rise .38s ease-out}
.panel.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.kicker{margin:0;color:var(--muted);font:10px 'Cormorant Garamond',Georgia,serif;letter-spacing:.3em;text-transform:uppercase}
.panel h1{margin:10px 0 8px;font-weight:400;font-size:clamp(22px,2.5vw,34px);letter-spacing:.14em;line-height:1.45}
.lead{margin:0 0 22px;max-width:76ch;color:#5b6753;font-size:12px;line-height:2.05}
.rule{width:54px;height:1px;background:var(--seal);opacity:.7;margin:18px 0}

/* 01 · narrative */
.narrative-stage{position:relative;margin:28px auto 22px;max-width:1080px;min-height:clamp(250px,42vh,390px);
  border:1px solid var(--line);background:linear-gradient(145deg,rgba(243,240,226,.9),rgba(225,227,207,.65));
  box-shadow:0 18px 44px rgba(37,52,34,.09);overflow:hidden;touch-action:none;cursor:ew-resize;user-select:none}
.narrative-stage:before{content:'';position:absolute;inset:12px;border:1px solid rgba(37,52,34,.08);pointer-events:none}
.stage-hint{position:absolute;top:14px;left:18px;z-index:6;font-size:10px;letter-spacing:.18em;color:var(--muted)}
.stage-count{position:absolute;top:14px;right:18px;z-index:6;font:11px 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;color:var(--muted)}
.layer{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 clamp(16px,5vw,68px);pointer-events:none}
.layer-base{font-family:var(--song);font-size:clamp(24px,3.6vw,48px);letter-spacing:.16em;color:#7e8572;line-height:1.6;
  text-shadow:2px 1px 0 rgba(37,52,34,.08);transform:translateY(calc(-50% + 2px)) translateX(var(--shift,0px))}
.layer-film{font-family:var(--kai);font-weight:700;font-size:clamp(24px,3.6vw,48px);letter-spacing:.08em;color:var(--seal);
  text-shadow:3px 2px 0 rgba(37,52,34,.09);transform:translateY(calc(-50% - 2px)) translateX(var(--shift,0px))}
.layer-film small{display:block;margin-top:12px;font-family:var(--serif);font-weight:400;font-size:clamp(10px,1.2vw,14px);letter-spacing:.1em;color:#6d6249}
.layer-danmu{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;transform:translateY(calc(-50% + 62px))}
.layer-danmu span{font-family:var(--song);font-size:clamp(12px,1.6vw,19px);letter-spacing:.08em;color:rgba(37,52,34,.72);
  background:rgba(243,240,226,.58);border:1px solid rgba(37,52,34,.12);padding:3px 10px}
.fragment{position:absolute;left:8%;right:8%;bottom:16%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  font-family:var(--song);font-size:clamp(9px,1.05vw,12px);letter-spacing:.1em;color:#6d7464}
.fragment span{border-bottom:1px dashed rgba(37,52,34,.22)}
.scrub{position:absolute;left:0;bottom:0;height:3px;background:var(--seal);width:0;transition:width .2s ease}
.narrative-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;max-width:1080px;margin:0 auto}
.note{padding:16px 18px;border:1px solid var(--line);background:rgba(243,240,226,.7);font-size:12px;line-height:1.95;color:#55614f;
  opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.note.show{opacity:1;transform:none}
.note h3{margin:0 0 6px;font-weight:400;font-size:13px;letter-spacing:.12em;color:var(--seal)}
.note.en h3,.note.en p{font-family:Georgia,var(--serif)}
.caveat{max-width:1080px;margin:18px auto 0;padding:14px 18px;border-left:2px solid rgba(37,52,34,.2);
  background:rgba(37,52,34,.045);font-size:11px;line-height:1.9;color:#5f6a57}
.caveat b{color:var(--ink);font-weight:500}
details.sources{max-width:1080px;margin:12px auto 0;font-size:11px;line-height:1.9;color:var(--muted)}
details.sources summary{cursor:pointer;letter-spacing:.1em;color:var(--seal)}
details.sources p{margin:8px 0 0;font-family:Georgia,var(--serif)}

/* 02 · anatomy */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 24px}
.tabs button{width:clamp(88px,11vw,132px);padding:10px 6px 8px;border:1px solid var(--line);background:rgba(243,240,226,.65);
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:background .25s,border-color .25s,color .25s}
.tabs button svg{width:42px;height:52px;overflow:visible}
.tab-boy{width:42px;height:52px;overflow:visible}
.card-boy{width:38px;height:44px;overflow:visible}
.tabs button span{font-size:11px;letter-spacing:.06em}
.tabs button small{font:9px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;opacity:.65}
.tabs button:hover{border-color:var(--seal)}
.tabs button.active{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 8px 22px rgba(37,52,34,.18)}
.anatomy-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,.9fr);gap:clamp(16px,3vw,44px);align-items:start;max-width:1120px;margin:0 auto}
.figure-wrap{position:relative;aspect-ratio:1/1.08;border:1px solid var(--line);background:
  linear-gradient(rgba(37,52,34,.045) 1px,transparent 1px) 0 0/100% 10%,
  linear-gradient(90deg,rgba(37,52,34,.045) 1px,transparent 1px) 0 0/10% 100%,
  radial-gradient(circle at 48% 34%,#f6f3e9,#e2e5d4);overflow:hidden}
.figure-wrap:after{content:'';position:absolute;inset:10px;border:1px solid rgba(37,52,34,.1);pointer-events:none}
.figure-svg{position:absolute;inset:0;width:100%;height:100%}
.figure-svg .body{fill:none;stroke:rgba(37,52,34,.22);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.figure-svg .bone{fill:none;stroke:#687565;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.figure-svg .force{fill:none;stroke:var(--verm);stroke-width:2.1;stroke-dasharray:6 5;stroke-linecap:round;marker-end:url(#arrow);opacity:.95}
.figure-svg .staff{stroke:#7c7359;stroke-width:4;stroke-linecap:round}
.figure-svg .ground{stroke:rgba(37,52,34,.32);stroke-width:1;stroke-dasharray:3 6}
/* 水墨少林小子 · ink-wash vector character */
.boy-head{fill:#e6e2cf;stroke:#2f372c;stroke-width:1.5}
.boy-ear{fill:#ded9c4;stroke:#2f372c;stroke-width:1.2}
.boy-eye{fill:#f4f1e2;stroke:#2f372c;stroke-width:1}
.boy-pupil{fill:#1c241a}
.boy-brow{fill:none;stroke:#1c241a;stroke-width:2.5;stroke-linecap:round}
.boy-mouth{fill:none;stroke:#4c5244;stroke-width:1.1;stroke-linecap:round}
.boy-scar{fill:#2f372c;opacity:.8}
.boy-robe{fill:#d6d3bf;stroke:#2f372c;stroke-width:1.5;stroke-linejoin:round}
.boy-robe-dark{fill:#bdb9a3;stroke:#2f372c;stroke-width:1.1}
.boy-collar{fill:none;stroke:#2f372c;stroke-width:1.3;stroke-linecap:round}
.boy-sash{fill:#60654f;stroke:#2f372c;stroke-width:.8}
.boy-beads{fill:#454a3b;stroke:#2f372c;stroke-width:.4}
.boy-guard{fill:#9a9b88;stroke:#2f372c;stroke-width:.9}
.boy-pants{fill:none;stroke:#9b9c88;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.boy-wrap{fill:none;stroke:#c0c0ac;stroke-width:5;stroke-linecap:round}
.boy-shoe{fill:#2f372c;stroke:#1c241a;stroke-width:.8}
.boy-hand{fill:#e6e2cf;stroke:#2f372c;stroke-width:1}
.boy-ink{fill:none;stroke:#2f372c;stroke-width:.75;stroke-linecap:round;opacity:.5}
.boy-splash{fill:#2f372c;opacity:.28}
.boy-staff{stroke:#4a4b3d;stroke-width:3.4;stroke-linecap:round}
.boy-patch{fill:#c98b2c;stroke:#6d4a25;stroke-width:.8;stroke-dasharray:1.4 1.2}
.boy-staff{stroke:#7c5a32;stroke-width:3.4;stroke-linecap:round}
.hotspot{position:absolute;width:25px;height:25px;margin:-12.5px 0 0 -12.5px;border-radius:50%;border:1px solid var(--verm);
  background:rgba(243,240,226,.92);color:var(--verm);font:10px 'Cormorant Garamond',Georgia,serif;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(37,52,34,.16);transition:transform .2s,background .2s,color .2s}
.hotspot:hover,.hotspot.active{transform:scale(1.18);background:var(--verm);color:#f5f1e4}
.figure-legend{position:absolute;left:14px;bottom:12px;z-index:2;font-size:10px;letter-spacing:.08em;color:var(--muted)}
.figure-legend i{display:inline-block;width:20px;border-top:2px dashed var(--verm);vertical-align:middle;margin-right:6px}
.anatomy-info h2{margin:4px 0 4px;font-weight:400;font-size:clamp(20px,2.2vw,28px);letter-spacing:.12em}
.anatomy-info .sub{margin:0 0 18px;color:var(--muted);font:11px 'Cormorant Garamond',Georgia,serif;letter-spacing:.16em}
.annotation{border:1px solid var(--line);background:rgba(246,243,231,.86);padding:18px 20px;min-height:204px;max-height:min(58vh,520px);overflow-y:auto;box-shadow:0 10px 30px rgba(37,52,34,.06)}
.annotation .placeholder{margin:0;color:var(--muted);font-size:12px;line-height:2}
.annotation h3{margin:0 0 8px;font-weight:400;font-size:17px;letter-spacing:.1em;color:var(--verm)}
.annotation .ann-group{padding:9px 0;border-top:1px dashed rgba(37,52,34,.16)}
.annotation .ann-group:first-of-type{border-top:0}
.annotation .tag{font-size:10px;letter-spacing:.16em;color:var(--seal)}
.annotation dl{margin:6px 0 0;display:grid;gap:9px}
.annotation dt{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.annotation dd{margin:2px 0 0;font-size:11.5px;line-height:1.85;color:#485542}
.disclaimer{grid-column:1/-1;max-width:1120px;margin:0;color:var(--muted);font-size:10px;line-height:1.8}

/* 03 · arena — game-style dohyo */
.arena-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.8fr);gap:clamp(16px,3vw,36px);max-width:1180px;margin:0 auto;align-items:start}
.arena-stage{position:relative;min-height:clamp(370px,55vh,530px);border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(ellipse at 50% 80%,rgba(120,140,100,.35),transparent 60%),linear-gradient(#eef0e3,#dce2cd)}
.arena-stage.shake{animation:stage-shake .5s ease}
@keyframes stage-shake{0%,100%{transform:translate(0)}25%{transform:translate(-7px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}}
.speedlines{position:absolute;inset:-40%;pointer-events:none;z-index:0;opacity:0;transition:opacity .6s;
  background:repeating-conic-gradient(from 0deg at 50% 72%,rgba(37,52,34,.11) 0deg 1.2deg,transparent 1.2deg 7deg);
  -webkit-mask-image:radial-gradient(circle at 50% 72%,transparent 14%,#000 40%,transparent 76%);
  mask-image:radial-gradient(circle at 50% 72%,transparent 14%,#000 40%,transparent 76%)}
.arena-stage.charge .speedlines{opacity:.85}
.hud{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;
  padding:7px 14px 8px;background:rgba(233,236,223,.93);border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
.hud-round{letter-spacing:.08em;color:var(--ink);white-space:nowrap}
.hud-round b{font:16px 'Cormorant Garamond',Georgia,serif;color:var(--seal);margin:0 2px}
.hud-gauge{display:flex;align-items:center;gap:6px;min-width:104px;flex:1;white-space:nowrap}
.gauge{flex:1;height:6px;background:rgba(37,52,34,.14);border:1px solid rgba(37,52,34,.2);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--seal);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.demon-status{position:absolute;right:5%;top:34%;z-index:6;display:flex;flex-direction:column;gap:5px;
  width:clamp(118px,22%,180px);padding:6px 9px;background:rgba(233,236,223,.92);
  border:1px solid var(--line);box-shadow:0 4px 14px rgba(37,52,34,.12);
  font-size:10px;letter-spacing:.12em;color:var(--muted)}
.demon-status .gauge{width:100%;flex:none}
.demon-status .gauge i{background:#4c4a46}
.arena-label{position:absolute;top:46px;left:18px;font:10px 'Cormorant Garamond',Georgia,serif;letter-spacing:.24em;color:var(--muted);z-index:2}
.strike-banner{position:absolute;left:50%;top:48px;transform:translate(-50%,-14px) scale(.85);z-index:7;min-width:min(70%,300px);
  padding:7px 22px 9px;background:var(--seal);color:#f8f3e6;text-align:center;border:1px solid #7d2f1f;
  box-shadow:0 8px 24px rgba(37,52,34,.24);opacity:0;pointer-events:none;transition:opacity .3s}
.strike-banner.show{opacity:1;animation:banner-in .55s cubic-bezier(.2,1.35,.3,1) both}
.strike-banner b{display:block;font-size:clamp(17px,2.5vw,27px);letter-spacing:.16em;font-weight:700;line-height:1.3}
.strike-banner small{display:block;font-size:10px;letter-spacing:.1em;opacity:.85;margin-top:2px}
@keyframes banner-in{0%{opacity:0;transform:translate(-50%,-20px) scale(.82)}60%{opacity:1;transform:translate(-50%,5px) scale(1.05)}100%{transform:translate(-50%,0) scale(1)}}
.dohyo{position:absolute;left:50%;bottom:6%;transform:translateX(-50%) perspective(620px) rotateX(56deg);z-index:1;
  width:min(74%,540px);height:min(30%,160px);border-radius:50%;border:9px solid #c8b586;
  background:radial-gradient(ellipse at 50% 38%,#e9e1c7,#cabd94);box-shadow:0 16px 28px rgba(37,52,34,.22),inset 0 0 0 2px rgba(37,52,34,.12)}
.dohyo-inner{position:absolute;inset:11px;border-radius:50%;border:1px dashed rgba(37,52,34,.26)}
.fighter{position:absolute;left:12%;bottom:14%;width:clamp(136px,18vw,214px);height:clamp(136px,18vw,214px);transform-origin:50% 90%;z-index:4}
.fighter svg{width:100%;height:100%;overflow:visible}
.fighter .force{fill:none;stroke:var(--verm);stroke-width:1.5;stroke-dasharray:4 4;opacity:.55}
.fighter.idle{animation:boy-float 3.2s ease-in-out infinite}
@keyframes boy-float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1.2deg)}}
.fighter.act{animation-duration:.95s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
.fighter.act.act-0{animation-name:strike-press}
.fighter.act.act-1{animation-name:strike-chop}
.fighter.act.act-2{animation-name:strike-thrust}
.fighter.act.act-3{animation-name:strike-push}
.fighter.act.act-4{animation-name:strike-zen}
@keyframes strike-press{0%{transform:translate(0,0) scale(1)}18%{transform:translate(-20px,15px) scale(.9) rotate(-6deg)}48%{transform:translate(88px,24px) scale(1.13) rotate(5deg)}62%{transform:translate(98px,20px) scale(1.1) rotate(4deg)}100%{transform:translate(0,0) scale(1)}}
@keyframes strike-chop{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-26px,-24px) rotate(-18deg)}50%{transform:translate(94px,-6px) rotate(16deg) scale(1.1)}65%{transform:translate(106px,8px) rotate(12deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes strike-thrust{0%{transform:translateX(0) scale(1)}18%{transform:translateX(-24px) scale(.94)}48%{transform:translateX(122px) scale(1.07)}62%{transform:translateX(130px) scale(1.05)}100%{transform:translateX(0) scale(1)}}
@keyframes strike-push{0%{transform:translateX(0) scale(1)}20%{transform:translateX(-22px) scale(.9)}50%{transform:translateX(134px) scale(1.15)}64%{transform:translateX(144px) scale(1.11)}100%{transform:translateX(0) scale(1)}}
@keyframes strike-zen{0%{transform:translateY(0) scale(1)}40%{transform:translateY(15px) scale(.96)}100%{transform:translateY(0) scale(1)}}
.fighter.bow{animation:bow 1.8s ease both}
@keyframes bow{0%{transform:rotate(0)}45%{transform:rotate(15deg) translateY(6px)}100%{transform:rotate(0)}}
.demon{position:absolute;right:11%;bottom:19%;width:clamp(180px,28vw,330px);height:clamp(190px,30vh,310px);z-index:3;
  filter:blur(9px);opacity:calc(var(--fog,1) * .92);transition:opacity .8s ease,transform 1.1s ease;transform:scale(calc(.86 + var(--fog,1) * .14))}
.demon.hit{animation:demon-hit .72s ease}
@keyframes demon-hit{0%{transform:translateX(0) scale(calc(.86 + var(--fog,1) * .14))}30%{transform:translateX(28px) scale(calc(.9 + var(--fog,1) * .14)) skewX(-6deg)}58%{transform:translateX(15px) skewX(3deg)}100%{transform:translateX(0) scale(calc(.86 + var(--fog,1) * .14))}}
.demon i{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(37,38,42,.82),rgba(37,38,42,.18) 70%,transparent 72%)}
.demon i:nth-child(1){inset:12% 8% 6% 12%}
.demon i:nth-child(2){width:60%;height:52%;left:4%;top:32%}
.demon i:nth-child(3){width:62%;height:48%;right:2%;top:20%}
.demon-eyes{position:absolute;right:calc(11% + clamp(76px,11vw,132px));bottom:calc(19% + clamp(92px,15vh,148px));width:56px;height:12px;z-index:5;
  display:flex;justify-content:space-between;opacity:calc(var(--fog,1));transition:opacity .8s}
.demon-eyes b{width:10px;height:8px;border-radius:50%;background:#b8432e;box-shadow:0 0 14px 4px rgba(184,67,46,.7)}
.impact{position:absolute;right:20%;bottom:40%;width:10px;height:10px;z-index:5;pointer-events:none}
.impact i{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:2px solid var(--verm);border-radius:50%;opacity:0}
.impact.go i{animation:impact-ring .75s ease-out}
.impact.go i:nth-child(2){animation-delay:.11s}
.impact.go i:nth-child(3){animation-delay:.22s}
@keyframes impact-ring{0%{transform:scale(.3);opacity:.95}100%{transform:scale(6.5);opacity:0}}
.effect-text{position:absolute;left:50%;top:26%;transform:translateX(-50%);white-space:nowrap;text-align:center;z-index:7;

function wipe(dx){

 {sil:'低马步下蹲、双虎爪下按 / 伏虎式剪影。',
  ana:'正面与侧面结合，显示下肢桩功、腰胯、肩肘腕指。圆点标注关键身体部位，点击弹出注释。',
  key:'足底/涌泉、膝、胯/髋、腰/丹田、肩、肘、腕/虎爪。',
  ess:'低马步下蹲，双虎爪下按 / 伏虎式；蹬地生根，屈膝对准脚尖，开胯坐胯、重心下沉，腰胯合住、气沉丹田，松肩沉肩、坠肘，腕沉指扣、虎爪含力而不僵，力达指梢。整体形成“下盘扎根、腰胯主宰、梢节贯力”的整劲，不是手臂局部用力。',
  err:'脚趾过度抓扣；膝内扣或跪膝；胯不稳导致上身散；塌腰、翘臀；耸肩；肘部外扬；虎爪僵硬或腕部失位导致力断。',
  rel:'发力链为足底→踝→膝→胯→腰→脊→肩→肘→腕→虎爪指梢。足底是起点，膝胯腰是传导与主宰，肩肘腕是梢节通道，虎爪是力达梢端。任一环节错误都会破坏“下盘扎根、腰胯主宰、梢节贯力”的整劲。',
  card:'互动页卡牌①“罗汉伏虎”完成时，调用足底、膝、胯、腰、肩、肘、腕/虎爪标注点作为判定参考。',
  en:{sil:'Low horse stance with both tiger claws pressing down.',ana:'Front and side views of the stance, hips/waist, shoulders, elbows, wrists and fingers. Tap the numbered points.',key:'Soles, knees, hips, waist/Dantian, shoulders, elbows, wrist and tiger claws.',ess:'Root the feet, align knees with toes, sit into the hips, settle the waist, sink the shoulders, drop the elbows and let power reach the tiger-claw tips. Whole-body power, not arm-only effort.',err:'Toes over-gripping; knees caving or passing the toes; unstable hips; collapsing lower back; raised shoulders; elbows flaring; rigid claws or wrists out of line.',rel:'Sole → ankle → knee → hip → waist → spine → shoulder → elbow → wrist → claw tips. Any break destroys the rooted, hip-led, tip-reaching power.',card:'Card 01 uses the sole, knee, hip, waist, shoulder, elbow and tiger-claw points as judging references.'}},
 {sil:'双手持棍、斜劈 / 立劈的劈山势剪影。',
  ana:'侧身持棍劈击姿态，显示握把、前手、后手、肩、腰、髋、步法与棍梢。圆点标注关键身体部位，点击弹出注释。',
  key:'前手（导向手）、后手（发力手）、肩、腰/脊、髋/步、棍梢。',
  ess:'双手持棍斜劈 / 立劈；前手控制棍路方向、握把不僵，后手催力、握把松紧适度；松肩送肩且与转腰同步，转腰拧脊、以腰为轴，蹬地转髋、步法稳住重心；力达棍梢，走弧线劈落。棍法核心不是“打得好看”，是“打得整”。',
  err:'只用手臂抡棍；握把过僵；肩部锁死；脚下无根导致棍飘；腰胯不转、只靠手臂；棍梢力点不清或劈落弧线散乱。',
  rel:'发力链为后脚蹬地→转髋→拧腰→送肩→肘→腕→棍把→棍梢。力从地起，经腰胯传导至棍梢；前手导向、后手催力共同保证棍路与整劲。',
  card:'互动页卡牌②“少林棍·劈山势”完成时，调用后手、腰/脊、髋/步、棍梢标注点作为判定参考。',
  en:{sil:'Two-handed staff, diagonal or vertical Split-the-Mountain strike.',ana:'Side-on striking view showing grip, front and rear hands, shoulder, waist, hips, stance and staff tip.',key:'Front guide hand, rear power hand, shoulder, waist/spine, hips/stance, staff tip.',ess:'Front hand guides the line with a supple grip; rear hand drives; shoulder sends in sync with the waist; waist twists as the axis; the feet root and the hips turn; power arrives at the tip along an arc.',err:'Arm-only swinging; rigid grip; locked shoulder; floating stance; waist and hips not turning; unclear tip power or scattered arc.',rel:'Rear foot pushes → hips turn → waist twists → shoulder sends → elbow → wrist → staff butt → staff tip. Front guides, rear drives.',card:'Card 02 uses rear hand, waist/spine, hips/stance and staff-tip points as judging references.'}},
 {sil:'单臂前伸、食指直指的一指禅剪影。',
  ana:'侧身一指伸出姿态，显示食指、腕、肘、肩、脊柱、丹田与下肢支撑。圆点标注关键身体部位，点击弹出注释。',
  key:'食指、腕、肘、肩、脊柱、丹田/腰腹、足/腿。',
  ess:'单臂前伸、食指直指；力点集中、直指而不僵，指节自然贯通；立腕/坐腕保持力线，坠肘不折不抬，松肩沉肩、肩胛稳定；脊柱中正竖直，丹田/腰腹核心稳定、呼吸不憋；蹬地生根，下肢支撑力上传。形成“从地到指”的贯通。所谓“直指”，不是物理性伤害，而是让心魔无法回避、自己被看见。',

  var card=e.target.closest('.card');if(!card||disposed||paused)return;
  dragIndex=+card.getAttribute('data-i');
  ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=en()?CARDS[dragIndex].en:CARDS[dragIndex].name;
  document.body.appendChild(ghost);moveGhost(e);card.setPointerCapture(e.pointerId);e.preventDefault();
});
function moveGhost(e){if(!ghost)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}
row.addEventListener('pointermove',function(e){
  if(dragIndex<0)return;moveGhost(e);
  var z=document.getElementById('dropZone').getBoundingClientRect();
  document.getElementById('dropZone').classList.toggle('over',e.clientX>=z.left&&e.clientX<=z.right&&e.clientY>=z.top&&e.clientY<=z.bottom);
});
function endDrag(e){
  if(dragIndex<0)return;
  var idx=dragIndex;
  var z=document.getElementById('dropZone').getBoundingClientRect();
  var inside=e.clientX>=z.left&&e.clientX<=z.right&&e.clientY>=z.top&&e.clientY<=z.bottom;
  document.getElementById('dropZone').classList.remove('over');
  if(ghost&&ghost.parentNode)ghost.parentNode.removeChild(ghost);
  ghost=null;dragIndex=-1;
  if(inside)play(idx);
}
row.addEventListener('pointerup',endDrag);row.addEventListener('pointercancel',endDrag);
function resetArena(){
  used=[false,false,false,false,false];renderCards();
  var demon=document.getElementById('demon'),eyes=document.getElementById('demonEyes');
  demon.style.opacity='';eyes.style.opacity='';
  demon.style.setProperty('--fog','1');eyes.style.setProperty('--fog','1');
  document.getElementById('demonBar').style.width='100%';
  document.getElementById('stanceBar').style.width='100%';
  document.getElementById('bowLine').classList.remove('show');
  document.getElementById('strikeBanner').classList.remove('show');
  document.getElementById('effectText').classList.remove('show');
  document.getElementById('arenaStage').classList.remove('charge','shake');
  var f=document.getElementById('fighter');
  f.classList.remove('bow','act','act-0','act-1','act-2','act-3','act-4');f.classList.add('idle');
  renderFighter(STAND_POSE);
  document.getElementById('strikeName').textContent=tr('strikeReady');
  document.getElementById('strikeSub').textContent=tr('strikeReadySub');
}
document.getElementById('resetBtn').onclick=resetArena;
// 数字键 / 空格 / R 出招，仅在擂台页生效
document.addEventListener('keydown',function(e){
  if(!document.getElementById('panel-arena').classList.contains('active'))return;
  if(e.key>='1'&&e.key<='5'){play(+e.key-1);return}
  if(e.key===' '){e.preventDefault();var n=nextIndex();if(n>=0)play(n);return}
  if(e.key==='r'||e.key==='R'){resetArena()}
});
// 点击土俵空白处 = 出下一式
document.getElementById('arenaStage').addEventListener('click',function(e){
  if(e.target.closest('.hud')||e.target.closest('.card'))return;
  var n=nextIndex();if(n>=0)play(n);
});
document.getElementById('completeBtn').onclick=function(){if(!disposed)send('wudao:complete',{result:{completed:true,summary:en()?'Shaolin chapter viewed':'少林篇章已浏览'}})};
document.getElementById('exitBtn').onclick=function(){if(parent!==window)send('wudao:exit');else go('narrative')};

/* ---------- host bridge ---------- */
function receive(event){
  if(event.source!==parent||event.origin!==parentOrigin||event.data?.version!==1||event.data?.arenaId!==arenaId||disposed)return;
  var d=event.data;
  if(d.type==='wudao:init'||d.type==='wudao:context'){context=d;paintText()}
  if(d.type==='wudao:pause')paused=!!d.paused;
  if(d.type==='wudao:dispose')dispose();
}
function dispose(){disposed=true;window.removeEventListener('message',receive)}
window.addEventListener('message',receive);
window.addEventListener('pagehide',dispose,{once:true});
window.addEventListener('resize',function(){step=innerWidth*.55});
paintText();
send('wudao:ready');
})();
</script>
